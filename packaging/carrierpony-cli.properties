# jpackage --add-launcher properties for the console-mode CLI. Wired up in build.gradle.kts,
# scoped to packageMsi.
#
# win-console=true builds a CONSOLE-subsystem carrierpony-cli.exe, so `carrierpony-cli inbox`
# actually prints. jpackage builds the main launcher as a GUI-subsystem executable, and a
# GUI-subsystem process on Windows has no stdout: every verb would run and discard its output
# (PGPony 1.0.0 shipped exactly that). Compose's windows { console = true } is the wrong fix; it
# attaches a console window to the GUI app too.
#
# The launcher is carrierpony-cli and not carrierpony because Windows filesystems are
# case-insensitive: carrierpony.exe and the GUI's CarrierPony.exe are the same filename, and
# jpackage fails with FileAlreadyExistsException.
#
# main-jar, main-class and app-version are deliberately omitted: an added launcher inherits them
# from the main application, so this file cannot drift from whatever Compose configures.
win-console=true
