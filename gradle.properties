# CarrierPonyDesktop build properties. Same sizing as PGPonyDesktop: org.gradle.jvmargs sizes the
# GRADLE daemon, kotlin.daemon.jvmargs sizes the separate KOTLIN COMPILE daemon, which is the one
# that runs out on a clean build. Values fit GitHub's ~7 GB macOS arm64 runner with headroom for
# jlink and jpackage.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# UTF-8 is load-bearing: the vendored string layers include non-Latin locales.
kotlin.code.style=official
