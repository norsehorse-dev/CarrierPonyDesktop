name: Build

# Every push and pull request: compile and run the full unit suite, including the vendored
# crypto core's own tests and the i18n audit (I18nTest). A broken main is visible the same day,
# not on release day.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build

      # Test XML carries whatever a test printed, which is the cheapest way to diagnose a
      # failure that does not reproduce locally.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/
